# =============================================
# KODUSERVERI DOCKER COMPOSE
# (/home/meelis/koduserver/docker-compose.yml)
# =============================================

services:
  # --- GRAV CMS (Custom Build) ---
  kirikiri:
    build: 
      context: ./kirikiri-grav
    container_name: kirikiri-production
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./kirikiri-grav:/var/www/html
    security_opt:
      - no-new-privileges:true

  # --- FTP SERVER KAAMERATELE ---
  # Docker isoleerib FTP serveri - näeb ainult kaamerad/ kausta
  ftp:
    image: delfer/alpine-ftp-server
    container_name: ftp-kaamerad
    restart: unless-stopped
    ports:
      - "21:21"                    # FTP control
      - "21100-21110:21100-21110"  # Passiivne režiim
    environment:
      - USERS=${FTP_USER}|${FTP_PASS}|/home/${FTP_USER}|1000
      - ADDRESS=${PASV_ADDRESS}
      - MIN_PORT=21100
      - MAX_PORT=21110
    volumes:
      - ./kaamerad:/home/${FTP_USER}
    security_opt:
      - no-new-privileges:true

  # --- CLOUDFLARE DDNS ---
  ddns:
    image: oznu/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: unless-stopped
    environment:
      - API_KEY=${CF_API_KEY}
      - ZONE=${CF_ZONE}
      - SUBDOMAIN=${CF_SUBDOMAIN}
      - PROXIED=false

