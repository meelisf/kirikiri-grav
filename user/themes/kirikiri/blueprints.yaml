name: Kirikiri
version: 1.0.0
description: Custom theme for Kirikiri online magazine, migrated from Astro.
icon: text-width
author:
  name: Antigravity
  email: antigravity@ai.com
homepage: https://github.com/getgrav/grav-theme-kirikiri
keywords: kirikiri, astro, migration, magazine
license: MIT

# Testitud Grav 2.0.27 vastu 2026-09-14 eraldi liivakastis: kõik lehed 200,
# null PHP-hoiatust, <body> väljund identne peale Gravi enda pildimõõtude
# paranduse. Twig jääb 2.0-s 3.x peale, teema kasutab ainult url() ja |raw.
compatibility:
  grav: ['1.7', '1.8', '2.0']

form:
  validation: loose
  fields:
    dropdown.enabled:
        type: toggle
        label: Dropdown in Menu
        highlight: 1
        default: 1
        options:
          1: Enabled
          0: Disabled
        validate:
          type: bool
